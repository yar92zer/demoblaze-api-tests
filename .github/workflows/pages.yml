name: Allure report
on:
  workflow_run:
    workflows: [ Tests ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download allure results
        uses: actions/download-artifact@v4
        with:
            pattern: allure-results-*
            merge-multiple: true
            path: allure-results
            run-id: ${{ github.event.workflow_run.id }}
            github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Allure CLI
        run: |
          curl -sSLo allure.tgz https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz
          tar -xzf allure.tgz
          echo "$PWD/allure-2.30.0/bin" >> $GITHUB_PATH

      - name: Generate report
        run: allure generate allure-results --clean -o allure-history
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-history

      - name: Deploy
        uses: actions/deploy-pages@v4